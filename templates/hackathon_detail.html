{% extends "catocode_base.html" %}
{% block title %}Hackathon · CatoCode{% endblock %}

{% block head %}
<style>
  .hd-wrap { max-width: 820px; margin: 0 auto; padding: 40px 24px 80px; }
  .hd-back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13.5px; font-weight: 600; margin-bottom: 24px; }
  .hd-back:hover { color: var(--ink); }
  .hd-card {
    background: rgba(255,255,255,.88); backdrop-filter: blur(10px);
    border: 1px solid rgba(15,23,42,.07); border-radius: 20px; padding: 28px 32px;
    box-shadow: 0 2px 8px rgba(15,23,42,.06); margin-bottom: 24px;
  }
  .hd-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 16px; }
  .hd-type-badge {
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px;
    border-radius: 99px; font-size: 11px; font-weight: 800; letter-spacing: .04em; flex-shrink: 0; margin-top: 4px;
  }
  .hd-type-badge.html { background: rgba(249,115,22,.12); color: #ea580c; }
  .hd-type-badge.game { background: rgba(139,92,246,.12); color: #7c3aed; }
  .hd-title { font-size: 28px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.2; flex: 1; }
  .hd-meta { display: flex; gap: 18px; font-size: 13px; color: var(--muted); flex-wrap: wrap; margin-bottom: 16px; }
  .hd-status { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; }
  .hd-status.active { color: #059669; }
  .hd-status.ended  { color: var(--muted); }
  .hd-status .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .hd-countdown { font-size: 32px; font-weight: 900; letter-spacing: -0.02em; color: var(--ink); font-variant-numeric: tabular-nums; margin: 12px 0; }
  .hd-countdown.urgent { color: #dc2626; }
  .hd-countdown.ended  { color: var(--muted); font-size: 22px; }
  .hd-desc { font-size: 15px; color: var(--ink-2); line-height: 1.6; white-space: pre-wrap; }
  .hd-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  /* submissions */
  .subs-card {
    background: rgba(255,255,255,.88); backdrop-filter: blur(10px);
    border: 1px solid rgba(15,23,42,.07); border-radius: 20px; padding: 24px 28px;
    box-shadow: 0 2px 8px rgba(15,23,42,.06);
  }
  .subs-card h3 { margin: 0 0 16px; font-size: 18px; font-weight: 800; }
  .sub-row {
    display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--line); margin-bottom: 10px;
    transition: border-color .12s, background .12s;
  }
  .sub-row:hover { border-color: var(--primary); background: rgba(14,165,233,.04); }
  .sub-row-num { font-size: 13px; font-weight: 800; color: var(--muted); width: 28px; text-align: center; }
  .sub-row-title { font-weight: 700; font-size: 15px; flex: 1; }
  .sub-row-author { font-size: 12.5px; color: var(--muted); }
  .pending-note { color: var(--muted); font-size: 14px; text-align: center; padding: 30px 0; }
  /* submit modal */
  .hm-bg { position: fixed; inset: 0; z-index: 200; background: rgba(15,23,42,.45); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; padding: 20px; }
  .hm-bg.show { display: flex; }
  .hm { width: min(500px,100%); background: rgba(255,255,255,.96); backdrop-filter: blur(12px) saturate(140%); border: 1px solid rgba(15,23,42,.08); border-radius: 22px; padding: 28px; box-shadow: 0 30px 80px rgba(15,23,42,.3); }
  .hm h2 { margin: 0 0 14px; font-size: 20px; font-weight: 800; }
  .sub-list { list-style: none; margin: 0; padding: 0; max-height: 280px; overflow-y: auto; }
  .sub-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; cursor: pointer; border: 1.5px solid var(--line); margin-bottom: 8px; transition: border-color .12s, background .12s; }
  .sub-item:hover { border-color: var(--primary); background: rgba(14,165,233,.06); }
  .sub-item.selected { border-color: var(--primary); background: rgba(14,165,233,.1); }
  .sub-item-title { font-weight: 700; font-size: 14px; flex: 1; }
  .hm-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 10px 16px; border-radius: 10px; background: #0F172A; color: #fff; font-size: 13.5px; font-weight: 600; opacity: 0; transition: opacity .2s; z-index: 999; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.error { background: #DC2626; }
</style>
{% endblock %}

{% block content %}
<div class="hd-wrap">
  <a href="/hackathons" class="hd-back">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    All Hackathons
  </a>

  <div class="hd-card" id="mainCard">
    <div style="color:var(--muted);font-size:14px">Loading…</div>
  </div>

  <div class="subs-card" id="subsCard" style="display:none"></div>
</div>

{% if current_user %}
<div class="hm-bg" id="submitModal">
  <div class="hm">
    <h2 id="submitModalTitle">Submit a Project</h2>
    <p style="color:var(--muted);font-size:13.5px;margin:0 0 10px">Pick one of your published projects.</p>
    <ul class="sub-list" id="subList"></ul>
    <div class="hm-actions">
      <button class="btn btn-ghost" id="subCancel">Cancel</button>
      <button class="btn btn-sky" id="subConfirm" disabled>Submit</button>
    </div>
  </div>
</div>
{% endif %}

<div id="toast" class="toast"></div>

<script>
(function () {
  const HID = {{ hid|tojson }};
  const loggedIn = {{ ('true' if current_user else 'false') }};
  let h = null, timer = null, timeRem = 0;
  let selectedProjectId = null;

  let toastTimer;
  function toast(msg, err) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.toggle('error', !!err); t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
  }
  function escHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function fmt(secs) {
    if (secs <= 0) return 'Ended';
    const d = Math.floor(secs / 86400), hh = Math.floor((secs % 86400) / 3600),
          m = Math.floor((secs % 3600) / 60), s = secs % 60;
    if (d > 0) return d + 'd ' + hh + 'h ' + m + 'm';
    if (hh > 0) return hh + 'h ' + m + 'm ' + String(s).padStart(2,'0') + 's';
    return m + ':' + String(s).padStart(2,'0');
  }

  function renderMain() {
    const card = document.getElementById('mainCard');
    const typeLabel = h.type === 'game' ? 'Game' : 'HTML';
    let actionHtml = '';
    if (loggedIn) {
      if (!h.ended) {
        if (h.submitted_project) {
          actionHtml = '<button class="btn btn-sky" id="openSubmit">Re-submit</button>'
            + '<a class="btn btn-ghost" href="/p/' + h.submitted_project + '" target="_blank">View my submission</a>';
        } else if (h.is_joined) {
          actionHtml = '<button class="btn btn-sky" id="openSubmit">Submit a project</button>';
        } else {
          actionHtml = '<button class="btn btn-sky" id="joinBtn">Join</button>';
        }
      }
    }
    card.innerHTML =
      '<div class="hd-header">'
        + '<span class="hd-type-badge ' + h.type + '">' + typeLabel + '</span>'
        + '<div class="hd-title">' + escHtml(h.title) + '</div>'
      + '</div>'
      + '<div class="hd-meta">'
        + '<span class="hd-status ' + (h.ended ? 'ended' : 'active') + '"><span class="dot"></span>' + (h.ended ? 'Ended' : 'Active') + '</span>'
        + '<span>Hosted by ' + escHtml(h.host_display) + '</span>'
        + '<span>' + h.participant_count + ' participant' + (h.participant_count !== 1 ? 's' : '') + '</span>'
        + '<span>' + h.submission_count + ' submission' + (h.submission_count !== 1 ? 's' : '') + '</span>'
      + '</div>'
      + '<div class="hd-countdown' + (h.ended ? ' ended' : (timeRem < 300 ? ' urgent' : '')) + '" id="cdDisplay">'
        + (h.ended ? 'Hackathon ended' : fmt(timeRem))
      + '</div>'
      + (h.description ? '<div class="hd-desc">' + escHtml(h.description) + '</div>' : '')
      + (actionHtml ? '<div class="hd-actions">' + actionHtml + '</div>' : '');

    if (!h.ended) {
      clearInterval(timer);
      timer = setInterval(() => {
        timeRem = Math.max(0, timeRem - 1);
        const el = document.getElementById('cdDisplay');
        if (el) { el.textContent = fmt(timeRem); el.className = 'hd-countdown' + (timeRem < 300 ? ' urgent' : ''); }
        if (timeRem <= 0) { clearInterval(timer); load(); }
      }, 1000);
    }
    const joinBtn = document.getElementById('joinBtn');
    if (joinBtn) joinBtn.addEventListener('click', () => doJoin(joinBtn));
    const openSub = document.getElementById('openSubmit');
    if (openSub) openSub.addEventListener('click', () => openSubmit());
  }

  function renderSubs() {
    const card = document.getElementById('subsCard');
    card.style.display = '';
    if (!h.ended) {
      card.innerHTML = '<h3>Submissions</h3><p class="pending-note">Submissions are revealed after the hackathon ends.</p>';
      return;
    }
    if (!h.submissions.length) {
      card.innerHTML = '<h3>Submissions</h3><p class="pending-note">No submissions were made.</p>';
      return;
    }
    let rows = h.submissions.map((s, i) =>
      '<div class="sub-row">'
        + '<span class="sub-row-num">' + (i + 1) + '</span>'
        + (s.project_url ? '<a class="sub-row-title" href="' + s.project_url + '" target="_blank">' + escHtml(s.project_title) + '</a>' : '<span class="sub-row-title">' + escHtml(s.project_title) + '</span>')
        + '<span class="sub-row-author">by ' + escHtml(s.user_id) + '</span>'
      + '</div>'
    ).join('');
    card.innerHTML = '<h3>Submissions (' + h.submissions.length + ')</h3>' + rows;
  }

  async function load() {
    try {
      const res = await fetch('/api/hackathons/' + HID);
      if (!res.ok) { document.getElementById('mainCard').innerHTML = '<p style="color:#dc2626">Hackathon not found.</p>'; return; }
      h = await res.json();
      timeRem = h.time_remaining;
      renderMain();
      renderSubs();
    } catch (e) {
      document.getElementById('mainCard').innerHTML = '<p style="color:#dc2626">Failed to load.</p>';
    }
  }

  async function doJoin(btn) {
    btn.disabled = true; btn.textContent = 'Joining…';
    try {
      const res = await fetch('/api/hackathons/' + HID + '/join', { method: 'POST' });
      const data = await res.json();
      if (!res.ok) { toast(data.error || 'Join failed', true); btn.disabled = false; btn.textContent = 'Join'; return; }
      toast('Joined!'); load();
    } catch (e) { toast('Join failed', true); btn.disabled = false; btn.textContent = 'Join'; }
  }

  {% if current_user %}
  const submitModal = document.getElementById('submitModal');
  document.getElementById('subCancel').addEventListener('click', () => submitModal.classList.remove('show'));
  submitModal.addEventListener('click', (e) => { if (e.target === submitModal) submitModal.classList.remove('show'); });

  async function openSubmit() {
    selectedProjectId = null;
    document.getElementById('subConfirm').disabled = true;
    document.getElementById('submitModalTitle').textContent = 'Submit a ' + (h.type === 'game' ? 'Game' : 'HTML Project');
    const list = document.getElementById('subList');
    list.innerHTML = '<li style="color:var(--muted);font-size:13px;padding:8px">Loading…</li>';
    submitModal.classList.add('show');
    try {
      const res = await fetch('/api/projects/mine');
      const projects = await res.json();
      const filtered = projects.filter((p) => p.type === h.type && p.published);
      list.innerHTML = '';
      if (!filtered.length) {
        list.innerHTML = '<li style="color:var(--muted);font-size:13px;padding:8px">No published ' + (h.type === 'game' ? 'game' : 'HTML') + ' projects found.</li>';
        return;
      }
      filtered.forEach((p) => {
        const li = document.createElement('li');
        li.className = 'sub-item'; li.dataset.pid = p.id;
        li.innerHTML = '<span class="sub-item-title">' + escHtml(p.title) + '</span>';
        li.addEventListener('click', () => {
          document.querySelectorAll('.sub-item').forEach((x) => x.classList.remove('selected'));
          li.classList.add('selected'); selectedProjectId = p.id;
          document.getElementById('subConfirm').disabled = false;
        });
        list.appendChild(li);
      });
    } catch (e) {
      list.innerHTML = '<li style="color:#dc2626;font-size:13px;padding:8px">Failed to load projects.</li>';
    }
  }

  document.getElementById('subConfirm').addEventListener('click', async () => {
    if (!selectedProjectId) return;
    const btn = document.getElementById('subConfirm');
    btn.disabled = true; btn.textContent = 'Submitting…';
    try {
      const res = await fetch('/api/hackathons/' + HID + '/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ project_id: selectedProjectId }),
      });
      const data = await res.json();
      if (!res.ok) { toast(data.error || 'Submit failed', true); btn.disabled = false; btn.textContent = 'Submit'; return; }
      submitModal.classList.remove('show'); toast('Submitted!'); load();
    } catch (e) { toast('Submit failed', true); btn.disabled = false; btn.textContent = 'Submit'; }
  });
  {% endif %}

  load();
})();
</script>
{% endblock %}
