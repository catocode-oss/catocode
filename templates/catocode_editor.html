<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>New Project · CatoCode</title>
  <link rel="preconnect" href="https://rsms.me/" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
  <style>
    :root {
      --sky-1: #BAE6FD;
      --sky-2: #E0F2FE;
      --ink: #0F172A;
      --ink-2: #334155;
      --muted: #64748B;
      --line: #E2E8F0;
      --primary: #0EA5E9;
      --primary-2: #0284C7;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      color: var(--ink);
      background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 100%);
      overflow: hidden;
      display: flex; flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }

    /* ── topbar ── */
    .topbar {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 12px;
      padding: 10px 18px;
      background: rgba(255, 255, 255, .85);
      backdrop-filter: blur(14px) saturate(140%);
      border-bottom: 1px solid rgba(15, 23, 42, .07);
    }
    .brand {
      display: flex; align-items: center; gap: 10px; font-weight: 800;
      font-size: 16px; letter-spacing: -0.01em;
    }
    .brand-logo {
      width: 32px; height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, #38BDF8 0%, #818CF8 55%, #A78BFA 100%);
      display: grid; place-items: center;
      box-shadow: 0 4px 12px rgba(56, 189, 248, .4), inset 0 1px 0 rgba(255,255,255,.3);
      flex-shrink: 0;
    }
    .topbar .title-tag {
      color: var(--muted); font-size: 13.5px; font-weight: 600; padding: 4px 10px;
      background: rgba(15,23,42,.05); border-radius: 8px;
    }
    .topbar-spacer { flex: 1; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 13.5px;
      border: 1px solid transparent; cursor: pointer; font-family: inherit;
      transition: transform .12s, background .15s, box-shadow .15s;
    }
    .btn-primary { background: var(--ink); color: #fff; box-shadow: 0 2px 6px rgba(15,23,42,.18); }
    .btn-primary:hover { background: #1E293B; transform: translateY(-1px); }
    .btn-sky {
      background: linear-gradient(135deg, #38BDF8, #6366F1);
      color: #fff; box-shadow: 0 4px 12px rgba(56, 189, 248, .35); font-weight: 700;
    }
    .btn-sky:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(56, 189, 248, .45); }
    .btn-ghost {
      background: rgba(255, 255, 255, .8); color: var(--ink); border-color: rgba(15, 23, 42, .08);
    }
    .btn-ghost:hover { background: #fff; }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .save-status { font-size: 12.5px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
    .save-status .dot { width: 7px; height: 7px; border-radius: 999px; background: #94A3B8; }
    .save-status.saving .dot { background: #F59E0B; animation: pulse 1s ease-in-out infinite; }
    .save-status.saved .dot { background: #10B981; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

    /* ── workspace ── */
    .workspace {
      flex: 1; min-height: 0;
      display: grid;
      grid-template-columns: 230px 1fr 1fr;
      gap: 0;
    }

    /* ── sidebar ── */
    .sidebar {
      background: rgba(255, 255, 255, .78);
      border-right: 1px solid rgba(15, 23, 42, .07);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .sidebar-section {
      padding: 14px 14px 6px;
    }
    .sidebar-section h4 {
      margin: 0 0 8px; font-size: 11px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .08em; color: var(--muted);
      display: flex; align-items: center; justify-content: space-between;
    }
    .sidebar-section h4 button {
      background: transparent; border: none; color: var(--primary-2); cursor: pointer;
      font-weight: 700; font-size: 12px; padding: 2px 6px; border-radius: 6px;
    }
    .sidebar-section h4 button:hover { background: rgba(14, 165, 233, .12); }

    .file-list {
      list-style: none; margin: 0; padding: 0;
      flex: 1; overflow-y: auto;
    }
    .file-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 14px; cursor: pointer; font-size: 13.5px;
      color: var(--ink-2); border-left: 3px solid transparent;
      transition: background .12s;
    }
    .file-item:hover { background: rgba(15, 23, 42, .04); }
    .file-item.active {
      background: rgba(14, 165, 233, .12);
      border-left-color: var(--primary);
      color: var(--primary-2); font-weight: 700;
    }
    .file-item .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-item .fact {
      visibility: hidden; padding: 2px 4px; border-radius: 4px;
      background: transparent; border: none; color: var(--muted); cursor: pointer;
      font-size: 12px;
    }
    .file-item:hover .fact { visibility: visible; }
    .file-item .fact:hover { background: rgba(15, 23, 42, .08); color: var(--ink); }
    .file-icon {
      flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 16px; border-radius: 4px;
      font-size: 9px; font-weight: 800; letter-spacing: .04em;
      color: #fff; font-family: ui-monospace, "SF Mono", monospace;
    }
    .file-icon.html { background: #E34F26; }
    .file-icon.css  { background: #1572B6; }
    .file-icon.js   { background: #F7DF1E; color: #1E1E1E; }
    .file-icon.txt  { background: #94A3B8; }

    .image-list {
      list-style: none; margin: 0; padding: 0; max-height: 220px; overflow-y: auto;
    }
    .image-item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 14px; font-size: 13px; color: var(--ink-2);
    }
    .image-item:hover { background: rgba(15, 23, 42, .04); }
    .image-item img {
      width: 28px; height: 28px; border-radius: 6px; object-fit: cover; background: #f1f5f9;
    }
    .image-item .iname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, monospace; font-size: 12px; }
    .image-item button {
      background: transparent; border: none; color: var(--muted); cursor: pointer; padding: 2px 6px; border-radius: 4px;
    }
    .image-item button:hover { background: rgba(15, 23, 42, .08); color: #DC2626; }

    .upload-row {
      padding: 6px 14px 14px;
    }
    .upload-btn {
      display: block; width: 100%; padding: 9px 12px; border-radius: 10px;
      background: rgba(14, 165, 233, .1); color: var(--primary-2);
      border: 1px dashed rgba(14, 165, 233, .4); cursor: pointer; text-align: center;
      font-weight: 600; font-size: 13px; font-family: inherit;
      transition: background .15s;
    }
    .upload-btn:hover { background: rgba(14, 165, 233, .18); }

    /* ── editor pane ── */
    .editor-pane {
      display: flex; flex-direction: column;
      background: #ffffff;
      min-width: 0;
    }
    .editor-header {
      flex-shrink: 0;
      padding: 8px 14px;
      border-bottom: 1px solid var(--line);
      background: #F8FAFC;
      display: flex; align-items: center; gap: 10px;
      font-size: 13.5px; color: var(--ink-2);
    }
    .editor-header .filename {
      font-family: ui-monospace, "SF Mono", monospace; font-weight: 700; color: var(--ink);
    }
    .editor-header-spacer { flex: 1; }
    #monacoMount { flex: 1; min-height: 0; }

    /* ── preview pane ── */
    .preview-pane {
      display: flex; flex-direction: column;
      background: #fff;
      border-left: 1px solid rgba(15, 23, 42, .07);
      min-width: 0;
    }
    .preview-header {
      flex-shrink: 0;
      padding: 8px 14px;
      border-bottom: 1px solid var(--line);
      background: #F8FAFC;
      display: flex; align-items: center; gap: 10px;
      font-size: 13px; color: var(--muted); font-weight: 600;
    }
    .preview-header .dot {
      width: 8px; height: 8px; border-radius: 999px; background: #10B981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, .2);
    }
    .preview-header-spacer { flex: 1; }
    #previewFrame {
      flex: 1; border: none; background: #fff;
    }

    /* ── modal ── */
    .modal-bg {
      position: fixed; inset: 0; background: rgba(15, 23, 42, .55);
      display: none; align-items: center; justify-content: center; z-index: 100;
      backdrop-filter: blur(4px);
    }
    .modal-bg.show { display: flex; }
    .modal {
      width: min(440px, 92vw); background: #fff; border-radius: 18px;
      padding: 26px 26px 22px;
      box-shadow: 0 30px 80px rgba(15, 23, 42, .35);
    }
    .modal h2 { margin: 0 0 6px; font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
    .modal p.sub { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    .field label { font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
    .field input, .field textarea {
      padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
      font-size: 14px; outline: none; font-family: inherit; background: #F8FAFC;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }
    .field input:focus, .field textarea:focus {
      border-color: var(--primary); background: #fff;
      box-shadow: 0 0 0 3px rgba(14, 165, 233, .18);
    }
    .field textarea { min-height: 80px; resize: vertical; }
    .warn-banner {
      padding: 10px 12px; border-radius: 10px; font-size: 13px;
      background: #FEF3C7; color: #92400E; border: 1px solid #FCD34D;
      margin-bottom: 16px; display: flex; gap: 8px; align-items: flex-start;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      padding: 10px 16px; border-radius: 10px;
      background: #0F172A; color: #fff; font-size: 13.5px; font-weight: 600;
      box-shadow: 0 10px 30px rgba(15, 23, 42, .3);
      opacity: 0; transition: opacity .2s; z-index: 200; pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .toast.error { background: #DC2626; }

    @media (max-width: 900px) {
      .workspace { grid-template-columns: 200px 1fr; }
      .preview-pane { display: none; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="/" class="brand">
      <span>CatoCode</span>
    </a>
    <span class="title-tag" id="titleTag">Untitled draft · not saved</span>
    <div class="topbar-spacer"></div>
    <span class="save-status" id="saveStatus" style="display:none;"><span class="dot"></span><span class="save-status-text">Saved</span></span>
    <button id="detailsBtn" class="btn btn-ghost" style="display:none;">Details</button>
    <button id="saveBtn" class="btn btn-ghost" style="display:none;">Save</button>
    <a href="/" class="btn btn-ghost" id="discardBtn">Discard</a>
    <button id="publishBtn" class="btn btn-sky">Publish ☁</button>
  </div>

  <div class="workspace">
    <aside class="sidebar">
      <div class="sidebar-section">
        <h4>
          Files
          <button id="newFileBtn" title="New file">+ New</button>
        </h4>
        <ul id="fileList" class="file-list"></ul>
      </div>
      <div class="sidebar-section">
        <h4>Images</h4>
        <ul id="imageList" class="image-list"></ul>
        <div class="upload-row">
          <input type="file" id="imageUpload" accept="image/*" multiple style="display:none" />
          <button class="upload-btn" id="uploadImageBtn">⬆ Upload Image</button>
        </div>
      </div>
    </aside>

    <section class="editor-pane">
      <div class="editor-header">
        <span>📄</span>
        <span class="filename" id="currentFile">index.html</span>
        <div class="editor-header-spacer"></div>
        <button id="renameBtn" class="btn btn-ghost" style="padding:4px 10px;font-size:12.5px;">Rename</button>
        <button id="deleteBtn" class="btn btn-ghost" style="padding:4px 10px;font-size:12.5px;color:#DC2626;">Delete</button>
      </div>
      <div id="monacoMount"></div>
    </section>

    <section class="preview-pane">
      <div class="preview-header">
        <span class="dot"></span>
        <span>Live Preview</span>
        <div class="preview-header-spacer"></div>
        <button id="refreshBtn" class="btn btn-ghost" style="padding:4px 10px;font-size:12.5px;">↻ Refresh</button>
      </div>
      <iframe id="previewFrame" sandbox="allow-scripts allow-modals allow-forms"></iframe>
    </section>
  </div>

  <!-- publish / details modal -->
  <div id="publishModal" class="modal-bg">
    <div class="modal">
      <h2 id="modalTitle">Publish your project</h2>
      <p class="sub" id="modalSub">Give it a name — you can keep editing it any time.</p>
      <div class="field">
        <label for="pubTitle">Title</label>
        <input id="pubTitle" type="text" maxlength="80" placeholder="My awesome project" />
      </div>
      <div class="field">
        <label for="pubDesc">Description</label>
        <textarea id="pubDesc" maxlength="500" placeholder="What does it do?"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cancelPublishBtn">Cancel</button>
        <button class="btn btn-sky" id="confirmPublishBtn">Publish</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // Server-provided bootstrap: existing project (edit/remix) or null (new).
    window.BOOT = {
      mode: {{ mode|tojson }},
      project: {{ (project or None)|tojson }},
      loggedIn: {{ ('true' if current_user else 'false') }},
    };
  </script>

  <script>
  // ─────────────────────────────────────────────────────────────────────
  // initial project state
  // ─────────────────────────────────────────────────────────────────────
  const STARTER_HTML = `<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>My Project</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Hello, CatoCode! ☁️</h1>
  <p>Edit <code>index.html</code>, <code>style.css</code> or <code>script.js</code> and watch it update live.</p>
  <button id="b">Click me</button>
  <script src="script.js"><\/script>
</body>
</html>
`;
  const STARTER_CSS = `body {
  font-family: system-ui, sans-serif;
  background: linear-gradient(180deg, #BAE6FD, #E0F2FE);
  color: #0F172A;
  min-height: 100vh;
  margin: 0;
  padding: 40px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
h1 { font-size: clamp(28px, 6vw, 48px); margin-bottom: 8px; }
button {
  margin-top: 14px;
  padding: 12px 22px;
  border: none;
  border-radius: 10px;
  background: #0EA5E9;
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 6px 16px rgba(14, 165, 233, .35);
}
button:hover { transform: translateY(-1px); }
`;
  const STARTER_JS = `document.getElementById('b').addEventListener('click', () => {
  alert('Hello from script.js!');
});
`;

  const BOOT = window.BOOT || { mode: 'new', project: null, loggedIn: false };
  const EDITING = BOOT.mode === 'edit' && BOOT.project;

  const state = EDITING ? {
    id: BOOT.project.id,
    title: BOOT.project.title || '',
    description: BOOT.project.description || '',
    published: !!BOOT.project.published,
    files: Object.assign({}, BOOT.project.files || {}),
    images: Object.assign({}, BOOT.project.images || {}),
    current: ('index.html' in (BOOT.project.files || {}))
      ? 'index.html' : Object.keys(BOOT.project.files || {})[0] || 'index.html',
  } : {
    id: null,
    title: '',
    description: '',
    published: false,
    files: {
      'index.html': STARTER_HTML,
      'style.css':  STARTER_CSS,
      'script.js':  STARTER_JS,
    },
    images: {},          // name -> data URL
    current: 'index.html',
  };

  // ─────────────────────────────────────────────────────────────────────
  // Monaco setup
  // ─────────────────────────────────────────────────────────────────────
  let editor = null;
  const models = {};   // filename -> ITextModel
  const refreshDebounced = debounce(refreshPreview, 280);

  require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });
  require(['vs/editor/editor.main'], () => {
    editor = monaco.editor.create(document.getElementById('monacoMount'), {
      automaticLayout: true,
      fontSize: 13.5,
      fontFamily: 'ui-monospace, "SF Mono", Menlo, monospace',
      minimap: { enabled: false },
      scrollBeyondLastLine: false,
      renderLineHighlight: 'gutter',
      tabSize: 2,
      wordWrap: 'on',
    });
    for (const name of Object.keys(state.files)) {
      models[name] = monaco.editor.createModel(state.files[name], languageOf(name));
    }
    editor.setModel(models[state.current]);
    editor.onDidChangeModelContent(() => {
      state.files[state.current] = editor.getValue();
      refreshDebounced();
      markDirty();
    });
    refreshPreview();
  });

  function languageOf(name) {
    const ext = name.split('.').pop().toLowerCase();
    if (ext === 'html' || ext === 'htm') return 'html';
    if (ext === 'css') return 'css';
    if (ext === 'js')  return 'javascript';
    return 'plaintext';
  }

  // ─────────────────────────────────────────────────────────────────────
  // file list rendering
  // ─────────────────────────────────────────────────────────────────────
  function fileIconHtml(name) {
    const ext = name.split('.').pop().toLowerCase();
    if (ext === 'html' || ext === 'htm') return '<span class="file-icon html">HTML</span>';
    if (ext === 'css') return '<span class="file-icon css">CSS</span>';
    if (ext === 'js')  return '<span class="file-icon js">JS</span>';
    return '<span class="file-icon txt">TXT</span>';
  }

  function renderFiles() {
    const ul = document.getElementById('fileList');
    ul.innerHTML = '';
    const names = Object.keys(state.files).sort((a, b) => {
      if (a === 'index.html') return -1;
      if (b === 'index.html') return 1;
      return a.localeCompare(b);
    });
    for (const name of names) {
      const li = document.createElement('li');
      li.className = 'file-item' + (name === state.current ? ' active' : '');
      li.innerHTML =
        `${fileIconHtml(name)}
         <span class="fname">${escapeHtml(name)}</span>`;
      li.addEventListener('click', () => switchFile(name));
      ul.appendChild(li);
    }
    document.getElementById('currentFile').textContent = state.current;
    document.getElementById('deleteBtn').disabled = (state.current === 'index.html');
  }

  function renderImages() {
    const ul = document.getElementById('imageList');
    ul.innerHTML = '';
    const names = Object.keys(state.images).sort();
    if (!names.length) {
      const li = document.createElement('li');
      li.className = 'image-item';
      li.style.color = 'var(--muted)';
      li.style.fontStyle = 'italic';
      li.textContent = 'No images yet';
      ul.appendChild(li);
      return;
    }
    for (const name of names) {
      const li = document.createElement('li');
      li.className = 'image-item';
      const img = document.createElement('img');
      img.src = state.images[name];
      img.alt = name;
      const span = document.createElement('span');
      span.className = 'iname';
      span.textContent = name;
      span.title = name;

      const copyBtn = document.createElement('button');
      copyBtn.title = 'Copy filename';
      copyBtn.textContent = '⧉';
      copyBtn.addEventListener('click', () => {
        navigator.clipboard?.writeText(name);
        toast(`Copied "${name}"`);
      });

      const renameBtn = document.createElement('button');
      renameBtn.title = 'Rename';
      renameBtn.textContent = '✎';
      renameBtn.addEventListener('click', () => renameImage(name));

      const delBtn = document.createElement('button');
      delBtn.title = 'Delete';
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', () => {
        if (confirm(`Delete image "${name}"?`)) {
          delete state.images[name];
          renderImages();
          refreshDebounced();
          markDirty();
        }
      });
      li.append(img, span, copyBtn, renameBtn, delBtn);
      ul.appendChild(li);
    }
  }

  function renameImage(oldName) {
    const next = prompt('Rename image to', oldName);
    if (!next || next === oldName) return;
    const ok = validateFilename(next, 'image');
    if (!ok) return;
    if (state.images[ok] || state.files[ok]) { toast('That name is taken', true); return; }
    // Preserve order isn't critical; just remap the key.
    state.images[ok] = state.images[oldName];
    delete state.images[oldName];
    // Update references in every text file so the preview keeps working.
    for (const fname of Object.keys(state.files)) {
      const re = new RegExp(escapeRegex(oldName), 'g');
      if (re.test(state.files[fname])) {
        state.files[fname] = state.files[fname].replace(new RegExp(escapeRegex(oldName), 'g'), ok);
        if (window.monaco && models[fname]) models[fname].setValue(state.files[fname]);
      }
    }
    renderImages();
    refreshDebounced();
    markDirty();
    toast(`Renamed to "${ok}"`);
  }

  function switchFile(name) {
    if (!(name in state.files)) return;
    state.current = name;
    if (editor && models[name]) editor.setModel(models[name]);
    renderFiles();
  }

  // ─────────────────────────────────────────────────────────────────────
  // file actions
  // ─────────────────────────────────────────────────────────────────────
  document.getElementById('newFileBtn').addEventListener('click', () => {
    const name = prompt('New file name (e.g. about.html, theme.css, util.js)');
    if (!name) return;
    const ok = validateFilename(name, 'file');
    if (!ok) return;
    if (state.files[ok]) { toast('File already exists', true); return; }
    state.files[ok] = '';
    if (window.monaco) models[ok] = monaco.editor.createModel('', languageOf(ok));
    state.current = ok;
    if (editor) editor.setModel(models[ok]);
    renderFiles();
    refreshDebounced();
    markDirty();
  });

  document.getElementById('renameBtn').addEventListener('click', () => {
    const old = state.current;
    if (old === 'index.html') { toast('index.html is required', true); return; }
    const next = prompt('Rename to', old);
    if (!next || next === old) return;
    const ok = validateFilename(next, 'file');
    if (!ok) return;
    if (state.files[ok]) { toast('File already exists', true); return; }
    state.files[ok] = state.files[old];
    delete state.files[old];
    if (models[old]) {
      const content = models[old].getValue();
      models[old].dispose();
      delete models[old];
      models[ok] = monaco.editor.createModel(content, languageOf(ok));
    }
    state.current = ok;
    if (editor) editor.setModel(models[ok]);
    renderFiles();
    refreshDebounced();
    markDirty();
  });

  document.getElementById('deleteBtn').addEventListener('click', () => {
    const cur = state.current;
    if (cur === 'index.html') return;
    if (!confirm(`Delete ${cur}?`)) return;
    delete state.files[cur];
    if (models[cur]) { models[cur].dispose(); delete models[cur]; }
    state.current = 'index.html';
    if (editor) editor.setModel(models['index.html']);
    renderFiles();
    refreshDebounced();
    markDirty();
  });

  // ─────────────────────────────────────────────────────────────────────
  // image upload
  // ─────────────────────────────────────────────────────────────────────
  document.getElementById('uploadImageBtn').addEventListener('click', () => {
    document.getElementById('imageUpload').click();
  });
  document.getElementById('imageUpload').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    for (const file of files) {
      if (file.size > 2 * 1024 * 1024) {
        toast(`"${file.name}" is over 2MB`, true);
        continue;
      }
      const name = uniqueName(file.name);
      const ok = validateFilename(name, 'image', /* silent */ true);
      if (!ok) { toast(`Invalid name: ${file.name}`, true); continue; }
      const dataUrl = await readAsDataURL(file);
      state.images[ok] = dataUrl;
      markDirty();
    }
    renderImages();
    refreshDebounced();
  });

  function readAsDataURL(file) {
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.onerror = rej;
      fr.readAsDataURL(file);
    });
  }

  function uniqueName(name) {
    const safe = name.replace(/[^A-Za-z0-9_\-.]/g, '_');
    if (!state.images[safe] && !state.files[safe]) return safe;
    const dot = safe.lastIndexOf('.');
    const base = dot >= 0 ? safe.slice(0, dot) : safe;
    const ext  = dot >= 0 ? safe.slice(dot)    : '';
    let i = 2;
    while (state.images[`${base}_${i}${ext}`] || state.files[`${base}_${i}${ext}`]) i++;
    return `${base}_${i}${ext}`;
  }

  function validateFilename(name, kind, silent) {
    name = (name || '').trim();
    if (!name || name.includes('/') || name.includes('\\')) {
      if (!silent) toast('Invalid filename', true);
      return null;
    }
    if (!/^[A-Za-z0-9_\-. ]+$/.test(name)) {
      if (!silent) toast('Letters, numbers, dot/dash/underscore only', true);
      return null;
    }
    if (!name.includes('.')) {
      if (!silent) toast('Filename must have an extension', true);
      return null;
    }
    const ext = name.split('.').pop().toLowerCase();
    if (kind === 'file' && !['html','htm','css','js'].includes(ext)) {
      if (!silent) toast('Only .html, .css, .js are allowed', true);
      return null;
    }
    if (kind === 'image' && !['png','jpg','jpeg','gif','webp','svg','ico','bmp'].includes(ext)) {
      if (!silent) toast('Unsupported image type', true);
      return null;
    }
    return name;
  }

  // ─────────────────────────────────────────────────────────────────────
  // live preview — fully self-contained srcdoc (no blob URLs)
  // Sandboxed iframes have a null origin and cannot load blob:// URLs
  // created by the parent, so we inline everything instead.
  // ─────────────────────────────────────────────────────────────────────
  function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  // Resolve a reference value to a local image data-URL, or null if it isn't a
  // local image. Absolute URLs (http/https/data/blob) are left untouched so a
  // local image whose name happens to be a substring of an external URL (e.g.
  // ".../star.png?v=1") never corrupts that URL.
  function resolveImage(val) {
    if (val == null) return null;
    val = String(val).trim();
    if (!val || /^(https?:|data:|blob:|#|mailto:|tel:)/i.test(val)) return null;
    const clean = val.replace(/^\.?\//, '');           // ./star.png, /star.png
    if (state.images[clean]) return state.images[clean];
    const base = clean.split('/').pop();               // assets/star.png
    if (state.images[base]) return state.images[base];
    return null;
  }

  const IMG_EXT_RE = /\.(?:png|jpe?g|gif|webp|svg|ico|bmp)$/i;

  function subImages(text) {
    // 1) HTML attributes: src / href / poster / data / content
    text = text.replace(
      /\b(src|href|poster|data|content)\s*=\s*("([^"]*)"|'([^']*)')/gi,
      (m, attr, _q, dq, sq) => {
        const val = dq !== undefined ? dq : sq;
        const data = resolveImage(val);
        return data ? `${attr}="${data}"` : m;
      }
    );
    // 2) CSS url(...)
    text = text.replace(
      /url\(\s*(['"]?)([^'")]+)\1\s*\)/gi,
      (m, _q, val) => { const d = resolveImage(val); return d ? `url(${d})` : m; }
    );
    // 3) Quoted string literals that name an image file (e.g. JS asset loaders
    //    like Phaser's load.image('star', 'star.png')).
    text = text.replace(
      /(['"`])([^'"`]+?)\1/g,
      (m, q, val) => {
        if (!IMG_EXT_RE.test(val.trim())) return m;
        const d = resolveImage(val);
        return d ? q + d + q : m;
      }
    );
    return text;
  }

  function refreshPreview() {
    let html = state.files['index.html'] || '';

    // Inline <link rel="stylesheet" href="file.css"> → <style>...</style>
    html = html.replace(
      /<link\b[^>]*\brel=["']stylesheet["'][^>]*>/gi,
      (tag) => {
        const m = /\bhref=["']([^"']+)["']/.exec(tag);
        if (!m) return tag;
        const content = state.files[m[1]];
        if (content == null) return tag;
        return `<style>${subImages(content)}</style>`;
      }
    );

    // Inline external JS files (script[src]) as inline script tags
    html = html.replace(
      /<script\b[^>]*\bsrc=["']([^"']+)["'][^>]*><\/script>/gi,
      (tag, src) => {
        const content = state.files[src];
        if (content == null) return tag;
        return '<' + 'script>' + subImages(content) + '<' + '/script>';
      }
    );

    // Substitute remaining image filename refs (src=, url(), etc.)
    html = subImages(html);

    document.getElementById('previewFrame').srcdoc = html;
  }

  document.getElementById('refreshBtn').addEventListener('click', refreshPreview);

  // ─────────────────────────────────────────────────────────────────────
  // publish / save / details flow
  // ─────────────────────────────────────────────────────────────────────
  const publishModal = document.getElementById('publishModal');
  const publishBtn   = document.getElementById('publishBtn');
  const saveBtn      = document.getElementById('saveBtn');
  const detailsBtn   = document.getElementById('detailsBtn');
  const discardBtn   = document.getElementById('discardBtn');
  let modalIntent = 'publish';   // 'publish' (new) | 'details' (edit)

  function syncCurrent() {
    if (editor && models[state.current]) {
      state.files[state.current] = models[state.current].getValue();
    }
  }

  // ── autosave: first edit creates a draft, later edits debounce a PATCH ──
  const loggedIn = !!BOOT.loggedIn;
  let dirty = false, autosavePaused = false, creatingDraft = false, autosaving = false, autosaveTimer = null;

  function setSaveStatus(s) {
    const el = document.getElementById('saveStatus'); if (!el) return;
    if (s === 'hidden') { el.style.display = 'none'; return; }
    el.style.display = ''; el.classList.toggle('saving', s === 'saving'); el.classList.toggle('saved', s === 'saved');
    el.querySelector('.save-status-text').textContent = s === 'saving' ? 'Saving…' : 'Saved';
  }
  function authPause() { autosavePaused = true; clearTimeout(autosaveTimer); setSaveStatus('hidden'); toast('Sign in to keep your work saved', true); }
  function projectBody(extra) {
    syncCurrent();
    return Object.assign({ title: state.title || 'Untitled draft', description: state.description, files: state.files, images: state.images }, extra || {});
  }
  function markDirty() {
    if (!loggedIn || autosavePaused) return;       // anonymous → no autosave; paused after auth loss
    dirty = true;
    if (!state.id) { ensureDraft(); return; }       // first edit creates the draft
    clearTimeout(autosaveTimer); autosaveTimer = setTimeout(autosaveNow, 1500);
  }
  async function ensureDraft() {
    if (state.id || creatingDraft) return;
    creatingDraft = true; setSaveStatus('saving');
    try {
      const res = await fetch('/api/projects', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(projectBody({ published: false })) });
      const data = await res.json();
      if (!res.ok) { if (data && data.login) { authPause(); return; } throw new Error(data.error || 'Autosave failed'); }
      state.id = data.id; state.published = false;
      try { history.replaceState(null, '', '/edit/' + state.id); } catch (e) {}
      setupTopbar(); dirty = false; setSaveStatus('saved');
    } catch (err) { setSaveStatus('hidden'); toast(err.message || 'Autosave failed', true); }
    finally { creatingDraft = false; if (dirty) markDirty(); }
  }
  async function autosaveNow() {
    if (!state.id || autosavePaused || autosaving) return;
    autosaving = true; dirty = false; setSaveStatus('saving');
    try {
      const res = await fetch('/api/projects/' + state.id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(projectBody()) });
      const data = await res.json();
      if (!res.ok) { if (data && data.login) { authPause(); return; } throw new Error(data.error || 'Save failed'); }
      setSaveStatus('saved');
    } catch (err) { dirty = true; setSaveStatus('hidden'); toast(err.message || 'Autosave failed', true); }
    finally { autosaving = false; if (dirty && !autosavePaused) { clearTimeout(autosaveTimer); autosaveTimer = setTimeout(autosaveNow, 1500); } }
  }

  function setupTopbar() {
    if (state.id) {
      saveBtn.style.display = '';
      detailsBtn.style.display = '';
      discardBtn.textContent = 'Back';
      discardBtn.href = '/account';
      if (state.published) {
        publishBtn.textContent = 'View ↗';
        document.getElementById('titleTag').textContent = (state.title || 'Untitled') + ' · Published';
      } else {
        publishBtn.textContent = 'Publish ☁';
        document.getElementById('titleTag').textContent = (state.title || 'Untitled') + ' · Draft';
      }
      if (loggedIn) setSaveStatus('saved');
    } else {
      document.getElementById('titleTag').textContent = 'Untitled draft · not saved';
      setSaveStatus('hidden');
    }
  }
  setupTopbar();

  function openModal(intent) {
    modalIntent = intent;
    document.getElementById('pubTitle').value = state.title || '';
    document.getElementById('pubDesc').value = state.description || '';
    if (intent === 'details') {
      document.getElementById('modalTitle').textContent = 'Project details';
      document.getElementById('modalSub').textContent = 'Update the title and description.';
      document.getElementById('confirmPublishBtn').textContent = 'Save details';
    } else {
      document.getElementById('modalTitle').textContent = 'Publish your project';
      document.getElementById('modalSub').textContent = 'Give it a name — you can keep editing it any time.';
      document.getElementById('confirmPublishBtn').textContent = 'Publish';
    }
    publishModal.classList.add('show');
    document.getElementById('pubTitle').focus();
  }

  publishBtn.addEventListener('click', () => {
    if (state.id && state.published) { window.location.href = '/p/' + state.id; return; }
    if (state.id && !state.published) { publishDraft(); return; }
    openModal('publish');               // brand-new project
  });
  detailsBtn.addEventListener('click', () => openModal('details'));
  saveBtn.addEventListener('click', () => saveProject(false));

  document.getElementById('cancelPublishBtn').addEventListener('click', () => {
    publishModal.classList.remove('show');
  });
  publishModal.addEventListener('click', (e) => {
    if (e.target === publishModal) publishModal.classList.remove('show');
  });

  function handleAuthError(data) {
    if (data && data.login) {
      toast('Please sign in first — redirecting…', true);
      const next = encodeURIComponent(location.pathname);
      setTimeout(() => { window.location.href = '/login?next=' + next; }, 900);
      return true;
    }
    return false;
  }

  document.getElementById('confirmPublishBtn').addEventListener('click', async () => {
    const title = document.getElementById('pubTitle').value.trim();
    const description = document.getElementById('pubDesc').value.trim();
    if (!title) { toast('Title is required', true); return; }
    state.title = title;
    state.description = description;
    if (modalIntent === 'details') {
      publishModal.classList.remove('show');
      setupTopbar();
      saveProject(false);
      return;
    }
    // publish: promote an existing draft (never duplicate) or create a new project
    const btn = document.getElementById('confirmPublishBtn');
    btn.disabled = true; btn.textContent = 'Publishing…';
    clearTimeout(autosaveTimer);
    try {
      if (state.id) {
        const res = await fetch('/api/projects/' + state.id, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(projectBody({ published: true })),
        });
        const data = await res.json();
        if (!res.ok) { if (handleAuthError(data)) return; throw new Error(data.error || 'Publish failed'); }
        state.published = true;
        toast('Published! Redirecting…');
        setTimeout(() => { window.location.href = '/p/' + state.id; }, 600);
      } else {
        syncCurrent();
        const res = await fetch('/api/projects', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title, description, published: true,
            files: state.files, images: state.images,
          }),
        });
        const data = await res.json();
        if (!res.ok) { if (handleAuthError(data)) return; throw new Error(data.error || 'Publish failed'); }
        toast('Published! Redirecting…');
        setTimeout(() => { window.location.href = data.url; }, 600);
      }
    } catch (err) {
      toast(err.message || 'Publish failed', true);
      btn.disabled = false; btn.textContent = 'Publish';
    }
  });

  async function saveProject(silent) {
    if (!state.id) return;
    clearTimeout(autosaveTimer);
    syncCurrent();
    saveBtn.disabled = true;
    const prev = saveBtn.textContent; saveBtn.textContent = 'Saving…'; setSaveStatus('saving');
    try {
      const res = await fetch('/api/projects/' + state.id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: state.title, description: state.description,
          files: state.files, images: state.images,
        }),
      });
      const data = await res.json();
      if (!res.ok) { if (handleAuthError(data)) return; throw new Error(data.error || 'Save failed'); }
      dirty = false; setSaveStatus('saved');
      if (!silent) toast('Saved');
    } catch (err) {
      toast(err.message || 'Save failed', true); setSaveStatus('hidden');
    } finally {
      saveBtn.disabled = false; saveBtn.textContent = prev;
    }
  }

  async function publishDraft() {
    if (!state.title) { openModal('publish'); return; }
    syncCurrent();
    publishBtn.disabled = true; publishBtn.textContent = 'Publishing…';
    try {
      const res = await fetch('/api/projects/' + state.id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: state.title, description: state.description,
          files: state.files, images: state.images, published: true,
        }),
      });
      const data = await res.json();
      if (!res.ok) { if (handleAuthError(data)) return; throw new Error(data.error || 'Publish failed'); }
      toast('Published! Redirecting…');
      setTimeout(() => { window.location.href = '/p/' + state.id; }, 600);
    } catch (err) {
      toast(err.message || 'Publish failed', true);
      publishBtn.disabled = false; publishBtn.textContent = 'Publish ☁';
    }
  }

  // ─────────────────────────────────────────────────────────────────────
  // helpers
  // ─────────────────────────────────────────────────────────────────────
  function debounce(fn, ms) {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
  }
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }
  let toastTimer;
  function toast(msg, err) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.toggle('error', !!err);
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  renderFiles();
  renderImages();
  </script>
</body>
</html>
